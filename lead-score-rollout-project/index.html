<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Lead score rollout: delivery plan</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f5;--sf:#fff;--ink:#16212c;--mu:#5b6877;--ln:#d3dae3;--ac:#1d4f91;--acs:#dbe7f7;--ok:#17714a;--oks:#d9f1e5;--wn:#8a5a00;--wns:#fbecc6;--bd:#a32b2b;--bds:#f8dcdc}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161d;--sf:#18212b;--ink:#e6ecf3;--mu:#97a4b4;--ln:#2b3745;--ac:#7fb0f0;--acs:#1f3550;--ok:#5fd09a;--oks:#14382a;--wn:#f0c25e;--wns:#3b2e0d;--bd:#f19090;--bds:#412020}}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px}

h1{font-size:1.5rem;margin:0;letter-spacing:-.01em}h2{font-size:1.1rem;margin:20px 0 6px}h3{font-size:.98rem;margin:14px 0 4px}
p,li{max-width:76ch}.mu{color:var(--mu);font-size:.88rem}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:14px}
nav button{background:none;border:0;color:var(--mu);padding:9px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin:10px 0}

label{display:inline-flex;flex-direction:column;gap:2px;margin:0 12px 8px 0;font-size:.85rem;color:var(--mu)}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:600}
.ok{background:var(--oks);color:var(--ok)}.wn{background:var(--wns);color:var(--wn)}.bd{background:var(--bds);color:var(--bd)}.ne{background:var(--acs);color:var(--ac)}
.gantt{position:relative;margin-top:6px}.gr{position:relative;height:30px;border-bottom:1px dashed var(--ln)}
.gb{position:absolute;top:5px;height:20px;background:var(--ac);border-radius:4px;color:#fff;font-size:.75rem;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;min-width:6px}
.gb.o{background:var(--mu)}.ln{position:absolute;top:0;bottom:0;width:2px;background:var(--bd)}

</style></head><body><main>
<header><div><h1>Lead score rollout: delivery plan</h1><div class="mu">Delivery plan for 60 sales representatives across the North, West and South regions</div></div>
<div><label>Full go-live date<input type="date" id="L" value="2026-12-21"></label> <span id="vd" class="pill bd">Not ready</span></div></header>
<nav id="nv"></nav><section id="v"></section>
<script>
const $=s=>document.querySelector(s);let S={chk:{},uat:{},g:{},p:{},tab:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('lsr')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('lsr',JSON.stringify(S))}catch(e){}};
const pill=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const L0=()=>new Date($('#L').value+'T00:00:00Z');
const fd=o=>new Date(L0().getTime()+o*864e5).toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'});
// ---------- data
const PH=[['Handover and repro checks',-53,-46,'DS to MLOps'],['Pipeline, CRM and checks build',-46,-32,'Data Eng, CRM'],['UAT in staging',-32,-25,'PM, Sales Ops'],['Shadow mode, all regions',-32,-18,'MLOps, DS'],['Training (managers, then reps)',-25,-5,'Enablement'],['Pilot: West region live',-18,-4,'Sales Ops'],['Readiness review, go/no-go',-4,-3,'VP Sales'],['Hypercare (all 60 reps)',0,14,'PM, MLOps']];
const CH=[['Handover: data science to engineering and ops',[['Model card: purpose, population, features, metrics by band and region, limits, fairness checks','DS',1],['Code tagged v1.0.0 in Git; pinned environment (lockfile plus container image digest)','DS',1],['Model in registry with training-data snapshot hash and feature spec; semantic versioning (major = features change)','MLOps',1],['Reproducibility check: retrain from the tag reproduces AUC within 0.002 and golden-file scores within 0.001','MLOps',1],['Train/serve parity tests: golden set of 500 leads plus unit tests on feature logic','DS',1],['Runbook: failure modes, rollback, who to page, fallback behaviour','MLOps',1],['Written handover sign-off: engineering accepts, DS stays on call for 4 weeks','PM',1]]],
['Pipeline and CRM',[['Data contract for the lead extract (columns, types, nullability) stored in the repo','Data Eng',1],['All nine pipeline checks live; alerts routed to named owners','Data Eng',1],['Score write-back to CRM: score, band, top 3 reason codes, model version, scored_at','CRM Admin',1],['Fail-safe: stale or missing score is labelled and routing falls back to legacy round-robin','MLOps',1],['Override field with mandatory reason code, logged with user and time','CRM Admin',1],['Manager view: band mix, contact-SLA, overrides per rep','Sales Ops',0]]],
['Validation',[['UAT executed in staging and gate met (UAT tab)','PM',1],['Rollback drill completed end to end in under 30 minutes','MLOps',1],['Load test at 3x peak daily leads, scored within SLA','MLOps',0]]],
['People',[['Managers and reps trained; attendance 95% or more, 100% of managers','Enablement',1],['One champion per region (about 1 per 6 reps) named','Sales Ops',0],['Hypercare rota covering go-live plus 14 days','PM',1],['Leadership message: why scores, what changes, what does not','VP Sales',0]]]];
const P=[['Schema: unexpected new columns','count',1,1e9,'Data Eng','hi'],['Schema: model feature missing, renamed or retyped','count',1e9,1,'Data Eng','hi'],['Freshness: minutes since latest lead update (business hours)','min',30,120,'Data Eng','hi'],['Volume: daily leads vs same-weekday 4-week median','% change',30,50,'Data Eng (Sales Ops confirms campaigns)','abs'],['Missing values: worst feature null-rate rise vs baseline','pp',5,15,'Data Eng + DS','hi'],['Duplicates: share of repeated lead_id','%',.5,2,'Data Eng','hi'],['Coverage: leads scored within 15 min','%',98,95,'MLOps','lo'],['Score drift: PSI vs baseline distribution','PSI',.1,.25,'DS','hi'],['CRM write-back failures','%',1,5,'CRM Admin','hi']];
const UAT=[['Lead created in CRM gets score and band within 15 min','95% of 200 test leads',1],['Live scores match golden file','500 leads, max difference 0.001',1],['Top 3 reason codes render on desktop and mobile CRM','All test leads',1],['Override needs a reason code and is logged','100% of attempts',1],['Hot leads go to priority queue with alert; missing score falls back to round-robin','All cases',1],['Stale-score banner shows when scored_at is over 2 h old','Triggered in 1 test',1],['Role access: reps see own leads, managers see team view','No leaks across regions',1],['Injected faults (schema change, stale data, 50% volume drop, null spike) page the right owner','Page in under 10 min',1],['Rollback switch restores legacy routing','Under 30 min, no data loss',1],['Manager dashboard reconciles with CRM export','Within 1%',0],['Comprehension quiz: read a band and decide on override','10 reps, 80% correct',0],['Lead record opens with score shown','p95 under 3 s',0]];
const G={Shadow:{d:'2 weeks, all regions. Scores written to a hidden field; reps see nothing.',r:[['Daily pipeline runs succeeded','ge',99,'%'],['Leads scored within SLA','ge',98,'%'],['Live vs golden score parity','ge',99,'%'],['AUC drop vs validation','le',.03,'abs'],['Top-band lift as share of validation lift','ge',80,'%'],['Open critical alerts','le',0,'#']]},
Pilot:{d:'2 weeks, West region (20 reps) sees scores and routing. North and South stay in shadow.',r:[['UAT critical tests passed','ge',100,'%'],['Reps opening the score weekly','ge',70,'%'],['Hot leads contacted within SLA','ge',85,'%'],['Override rate','rng',[5,25],'%'],['Overrides with a reason code','ge',90,'%'],['Conversion vs pre-pilot baseline (guardrail)','ge',-3,'% rel.'],['Rep satisfaction (1 to 5)','ge',3.5,'score'],['Sev-1 incidents','le',0,'#']]},
'Go-live':{d:'Full launch on the fixed date for North and South, West continues.',r:[['Pilot gates all met (1 = yes)','ge',1,'flag'],['Rollback drill passed (1 = yes)','ge',1,'flag'],['Training completion, reps','ge',95,'%'],['Training completion, managers','ge',100,'%'],['Pipeline SLO met, trailing 14 days','ge',99,'%'],['Hypercare rota confirmed (1 = yes)','ge',1,'flag']]}};
const MON=[['Model','AUC and top-band lift on matured leads (rolling 30 d)','Within 0.03 of validation','Drop over 0.05, or lift under 1.5x for 2 weeks: retrain','Fortnightly','DS'],['Model','Calibration: predicted vs actual by band','Error under 0.05','Over 0.05 for 2 weeks: recalibrate or retrain','Fortnightly','DS'],['Drift','PSI of score and top 10 features','Under 0.1','Over 0.25 for 7 days: investigate, then retrain','Daily (automated)','DS'],['Drift','Input null rates, lead-source mix','Within baseline plus 5 pp','Source mix shift over 20%: review with Sales Ops','Daily','Data Eng'],['Pipeline','Freshness, volume, schema, coverage, write-back','Per Pipeline tab','Critical alert pages on-call','Continuous','Data Eng, MLOps'],['Adoption','Reps opening the score on worked leads','70% or more by week 2, 85% by week 8','Under 60% in a region: manager coaching plan','Weekly','Sales Ops'],['Adoption','Hot leads contacted within SLA','85% or more','Under 70%: routing or capacity review','Weekly','Sales Ops'],['Adoption','Override rate and reason mix','5% to 25%','Under 3%: blind trust; over 30%: distrust, retrain or retrain staff','Weekly','Managers'],['Adoption','Override accuracy: overridden leads vs model outcome','Track only','Overrides beat model: feed reasons to DS','Monthly','DS'],['Business','Lead-to-opportunity rate by band','Hot at least 2x Cool','Gap narrowing 3 weeks running','Weekly','Sales Ops'],['Business','Speed to first contact, Hot leads','Under 15 min median','Over 30 min','Weekly','Managers'],['Business','A/B lift, scored vs unscored routing','10% relative lift','Interim read only; decide at planned end','Monthly','DS, VP Sales'],['Retrain','Scheduled retrain','Quarterly','Earlier on any trigger above; new version goes through shadow','Quarterly','DS, MLOps']];
const RA=['PM','DS','Data Eng','MLOps','CRM Admin','Sales Ops','Managers','Enablement','VP Sales'];
const RC=[['Model card, versioning, reproducibility','I,AR,C,C,-,I,-,-,-'],['Scoring service and CRM write-back','I,C,R,AR,R,I,-,-,-'],['Pipeline checks and alerting','I,C,AR,R,-,I,-,-,-'],['CRM score fields, override, manager view','I,C,-,-,AR,C,C,I,-'],['UAT design and execution','A,C,C,C,R,R,R,I,I'],['Training pack and delivery','I,C,-,-,-,C,R,AR,I'],['Shadow and pilot go/no-go','R,C,C,C,-,C,C,-,A'],['Rollout execution and rollback','A,C,R,R,R,C,I,I,I'],['Monitoring dashboard and retraining','I,AR,C,R,-,C,-,-,I'],['Adoption drive and manager coaching','C,-,-,-,-,A,R,R,C'],['A/B evaluation (stretch)','C,AR,C,-,C,R,-,-,I'],['Go-live readiness review','R,C,C,C,C,C,C,C,A']];
// ---------- logic
const gv=(ph,i)=>S.g[ph+i];
function gEval(ph){let ok=0,n=0,pend=0;G[ph].r.forEach((q,i)=>{n++;const v=gv(ph,i);if(v===undefined||v===''){pend++;return}const x=+v;if(q[1]=='ge'?x>=q[2]:q[1]=='le'?x<=q[2]:x>=q[2][0]&&x<=q[2][1])ok++});return{ok,n,pend,go:ok==n}}
function uEval(){let c=0,ct=0,p=0,f=0,t=UAT.length;UAT.forEach((u,i)=>{const s=S.uat[i];if(u[2])ct++;if(s=='p'){p++;if(u[2])c++}if(s=='f')f++});return{c,ct,p,f,t,met:c==ct&&p/t>=.9}}
function pEval(i,v){const q=P[i];if(v===undefined||v==='')return['ne','No reading'];let x=+v;if(q[5]=='abs')x=Math.abs(x);if(q[5]=='lo')return x<=q[3]?['bd','Critical']:x<=q[2]?['wn','Warning']:['ok','OK'];return x>=q[3]?['bd','Critical']:x>=q[2]?['wn','Warning']:['ok','OK']}
function blockers(){let d=0,t=0;CH.forEach((g,gi)=>g[1].forEach((it,ii)=>{if(it[2]){t++;if(S.chk[gi+'-'+ii])d++}}));return{d,t}}
function verdict(){const b=blockers(),u=uEval(),a=gEval('Shadow'),p=gEval('Pilot');const ok=b.d==b.t&&u.met&&a.go&&p.go;const e=$('#vd');e.className='pill '+(ok?'ok':'bd');e.textContent=ok?'Ready to launch':'Not ready';return{ok,b,u,a,p}}
function z(p){if(p<.5)return -z(1-p);const t=Math.sqrt(-2*Math.log(1-p));return t-(2.515517+.802853*t+.010328*t*t)/(1+1.432788*t+.189269*t*t+.001308*t*t*t)}
function nArm(p1,rel,al,pw){const p2=p1*(1+rel);return Math.ceil(Math.pow(z(1-al/2)+z(pw),2)*(p1*(1-p1)+p2*(1-p2))/Math.pow(p2-p1,2))}
function abCalc(){const g=id=>+$('#'+id).value,p1=g('a1')/100,al=g('a3')/100,pw=g('a4')/100,de=g('a5'),w=g('a6')/100,lv=g('a7'),lag=g('a8');const f=1/(4*w*(1-w));
const tot=r=>Math.ceil(nArm(p1,r,al,pw)*2*de*f);const T=tot(g('a2')/100),wk=Math.ceil(T/lv),end=wk+Math.ceil(lag/7);
$('#abo').innerHTML=`<div class="g2"><div class="card"><div class="big">${T.toLocaleString('en-IN')}</div>leads in total (${Math.round(T*w).toLocaleString('en-IN')} scored, ${Math.round(T*(1-w)).toLocaleString('en-IN')} unscored)</div><div class="card"><div class="big">${end} weeks</div>${wk} weeks to accrue leads plus ${Math.ceil(lag/7)} weeks for outcomes to mature. Read-out around ${fd(end*7)} (dates counted from go-live).</div></div>`+tbl(['Relative lift','Leads in total','Weeks of enrolment'],[.05,.1,.15,.2,.3].map(r=>{const t=tot(r);return[Math.round(r*100)+'%',t.toLocaleString('en-IN'),Math.ceil(t/lv)]}))}
// ---------- views
const V=[
['Timeline',()=>{const s=-53,e=28,pc=o=>((Math.max(s,Math.min(e,o))-s)/(e-s)*100);const row=(n,a,b,o,c)=>`<div class="gr"><div class="gb ${c||''}" style="left:${pc(a)}%;width:${Math.max(pc(b)-pc(a),1.2)}%" title="${n}">${n}</div></div>`;
return`<div class="card"><b>Launch ${fd(0)}</b> (full go-live) <span class="mu">| first task starts ${fd(-53)} | hypercare ends ${fd(14)}</span><div class="gantt">${PH.map(p=>row(p[0],p[1],p[2])).join('')}${row('A/B holdout (continues beyond view)',0,28,0,'o')}<div class="ln" style="left:${pc(0)}%"></div></div></div>`+tbl(['Phase','Dates','Owner'],PH.map(p=>[p[0],fd(p[1])+' to '+fd(p[2]),p[3]]))+`<h2>Sequencing principles</h2><ul><li>Pipeline checks and the fail-safe are built and proven in shadow mode before any representative sees a score.</li><li>Managers are trained before representatives, and adoption is reviewed through the manager line.</li><li>One pilot region goes live first; a failed gate leaves the other regions on legacy routing.</li><li>Hypercare runs 14 days past launch.</li></ul>`}],
['Checklist',()=>{const b=blockers();return`<div class="card">Blockers done: <b>${b.d} of ${b.t}</b> (marked <b>B</b>). Launch cannot proceed until all are ticked.</div>`+CH.map((g,gi)=>`<h2>${g[0]}</h2>`+g[1].map((it,ii)=>`<label class="cb"><input type="checkbox" data-c="${gi}-${ii}" ${S.chk[gi+'-'+ii]?'checked':''}><span>${it[0]} <span class="mu">| ${it[1]}</span> ${it[2]?pill('ne','B'):''}</span></label>`).join('')).join('')}],
['Pipeline',()=>`<p><b>Warning</b>: Slack alert to the owner, acknowledged within 4 business hours. <b>Critical</b>: on-call paged, acknowledged within 15 minutes; scores show as unavailable and routing reverts to legacy until resolved; Sales Ops informed within 30 minutes.</p>`+tbl(['Check','Warn at','Critical at','Owner','Reading','Status'],P.map((q,i)=>{const s=pEval(i,S.p[i]),lo=q[5]=='lo',f=x=>x>=1e9?'never':(lo?'≤ ':'≥ ')+x;return[q[0],f(q[2]),f(q[3]),q[4],`<input type="number" step="any" data-p="${i}" value="${S.p[i]??''}"> ${q[1]}`,pill(s[0],s[1])]})) +`<p class="mu">Checks run on every pipeline run and hourly during business hours (8 am to 8 pm IST). Overnight freshness limits double.</p>`],
['UAT and training',()=>{const u=uEval();return`<div class="card">Gate: every critical test passes and at least 90% pass overall. Now: <b>${u.p}/${u.t}</b> passed, ${u.f} failed, ${u.c}/${u.ct} critical. ${pill(u.met?'ok':'bd',u.met?'Gate met':'Gate not met')}</div>`+tbl(['Test','Pass criterion','Type','Result'],UAT.map((q,i)=>[q[0],q[1],q[2]?'Critical':'Standard',`<select data-u="${i}"><option value="">Not run</option><option value="p" ${S.uat[i]=='p'?'selected':''}>Pass</option><option value="f" ${S.uat[i]=='f'?'selected':''}>Fail</option></select>`]))+`<h2>Training pack outline</h2><div class="g2"><div class="card"><b>Reps (90 min plus floor-walk)</b><ul><li>Why this model, and what it learned from (10 min)</li><li>Reading a score: band, reason codes, what it is not</li><li>Hands-on: work 10 real past leads, then compare outcomes</li><li>Override rules and the reason codes</li><li>Where to get help; 1-page card; 3-minute videos</li><li>Quiz: 80% to pass; floor-walk in week 1</li></ul></div><div class="card"><b>Managers (2 h plus 30-min coaching clinic)</b><ul><li>Everything reps get, plus the team dashboard</li><li>Weekly 15-minute review: SLA, overrides, adoption</li><li>Coaching a rep who ignores or over-trusts scores</li><li>Handling escalations; when to request rollback</li><li>Approving and auditing overrides</li></ul></div></div><h2>Reading a score</h2><p>The score is a probability-style rank, not a verdict. Bands come from percentiles of scored leads: <b>Hot</b> (top 10%), <b>Warm</b> (next 30%), <b>Cool</b> (next 40%), <b>Cold</b> (bottom 20%). Contact Hot leads within 15 minutes, Warm the same day; Cool and Cold follow normal cadence. The top 3 reason codes show why, so use them to open the call.</p><h3>When to override</h3><ul><li><b>Do</b>, with a reason code: existing customer or live deal, a direct buying signal from a call or email the CRM has not captured, duplicate or test lead, competitor, compliance block.</li><li><b>Do not</b> override because the lead “feels” weak, the company is unfamiliar, or to avoid a hard call. Managers review overrides weekly; the best patterns go to data science as new features.</li><li>Overriding is normal (5% to 25%). Zero overrides means blind trust; over 30% means the model or the training is failing.</li></ul>`}],
['Rollout gates',()=>Object.keys(G).map(ph=>{const r=gEval(ph),g=G[ph];return`<div class="card"><h3 style="margin:0">${ph} ${pill(r.go?'ok':r.pend?'ne':'bd',r.go?'GO':r.pend?r.pend+' pending':'NO-GO')}</h3><div class="mu">${g.d}</div>`+tbl(['Criterion','Required','Actual','Met'],g.r.map((q,i)=>{const v=gv(ph,i),has=v!==undefined&&v!=='',x=+v,m=q[1]=='ge'?x>=q[2]:q[1]=='le'?x<=q[2]:x>=q[2][0]&&x<=q[2][1];return[q[0],(q[1]=='ge'?'≥ ':q[1]=='le'?'≤ ':'')+(q[1]=='rng'?q[2][0]+' to '+q[2][1]:q[2])+' '+q[3],`<input type="number" step="any" data-g="${ph}|${i}" value="${has?v:''}">`,has?pill(m?'ok':'bd',m?'Yes':'No'):'']}))+`</div>`}).join('')+`<h2>Rollback procedure</h2><div class="card"><b>Triggers</b> (any one): Sev-1 data or scoring incident unresolved for 4 hours; hot-lead SLA falls below 60% for 3 days; manager and rep escalation from two or more regions; conversion guardrail breached for 2 weeks.<ol><li>Incident lead (MLOps) declares rollback; VP Sales is told within 15 minutes.</li><li>Flip the feature flag: CRM routing returns to legacy round-robin; score fields are hidden but still written for diagnosis.</li><li>Revert to the last registered model version if the cause is the model; otherwise fix the pipeline in place.</li><li>Sales Ops posts a plain message to all reps within 1 hour: what happened, what to do now.</li><li>Target under 30 minutes for steps 2 to 3 (proved in the rollback drill).</li><li>Re-entry: root-cause note, one clean day in shadow, then a go decision again.</li></ol></div>`],
['A/B test',()=>`<p>Lead-level random split inside each region (stratified by lead source), <b>scored routing</b> (priority queue plus SLA for Hot) vs <b>unscored routing</b> (legacy round-robin). Primary metric is lead-to-opportunity within 30 days, because lead-to-won is too slow for a decision. Guardrails: contact SLA, rep satisfaction, pipeline value per lead.</p><div class="card"><label>Baseline conversion %<input class="ab" id="a1" type="number" value="10" step="any"></label><label>Relative lift to detect %<input class="ab" id="a2" type="number" value="10"></label><label>Significance %<input class="ab" id="a3" type="number" value="5"></label><label>Power %<input class="ab" id="a4" type="number" value="80"></label><label>Rep-clustering inflation<input class="ab" id="a5" type="number" value="1.1" step="0.05"></label><label>Scored share %<input class="ab" id="a6" type="number" value="50"></label><label>New leads per week<input class="ab" id="a7" type="number" value="2500"></label><label>Outcome lag (days)<input class="ab" id="a8" type="number" value="30"></label></div><div id="abo"></div><h3>How to run it</h3><ul><li>Fix duration and sample size up front; no early stopping on a good-looking week. Interim reads are for safety only.</li><li>Analyse with a two-proportion test, then a model with rep as a random effect as a check.</li><li>A 50/50 split is the cheapest in leads; a 70/30 split costs about 19% more leads but keeps more leads on scoring.</li><li>The test cannot finish before the launch date. The pilot only checks guardrails, not lift.</li></ul>`],
['Monitoring',()=>`<p>One dashboard in four rows: pipeline health tiles, model quality and drift trends, adoption by region and manager, business impact by band. Every tile shows target, current value and trend. Review cadence: daily automated health, weekly adoption review (Sales Ops with managers), fortnightly model review (DS), monthly steering (VP Sales).</p>`+tbl(['Area','Metric','Target','Trigger and action','Cadence','Owner'],MON)],
['RACI',()=>`<p class="mu">R = does the work, A = accountable (one per row), C = consulted, I = informed.</p>`+tbl(['Activity',...RA],RC.map(r=>[r[0],...r[1].split(',').map(x=>`<span class="pill ${x.includes('A')?'ne':x=='-'?'':x.includes('R')?'ok':''}">${x}</span>`)]))],
['Readiness',()=>{const v=verdict();const row=(n,ok,d)=>[n,pill(ok?'ok':'bd',ok?'Met':'Open'),d];return`<div class="card"><div class="big">${v.ok?'Ready to launch':'Not ready to launch'}</div>Decision owner: VP Sales. Launch needs every row below met, no exceptions without a written risk acceptance.</div>`+tbl(['Condition','Status','Detail'],[row('Blocker checklist items',v.b.d==v.b.t,v.b.d+' of '+v.b.t),row('UAT gate',v.u.met,v.u.p+'/'+v.u.t+' passed, '+v.u.c+'/'+v.u.ct+' critical'),row('Shadow gate',v.a.go,v.a.ok+'/'+v.a.n+' criteria'),row('Pilot gate',v.p.go,v.p.ok+'/'+v.p.n+' criteria')])+`<h2>How adoption is driven</h2><ul><li>Managers inspect: Hot-lead SLA and overrides are part of the weekly 1:1, not an optional report.</li><li>Reps see their own results by band, so they can check the model against their own wins.</li><li>Reason codes make each score explainable; overrides are allowed and counted, so reps keep their judgement.</li><li>Regional champions and week-1 floor-walks; override reasons fed back to DS and published monthly (“you said, we changed”).</li><li>Adoption targets are in the Monitoring tab, and a region below 60% gets a coaching plan.</li></ul><h2>Risks that remain after go-live</h2><ul><li><b>Drift and seasonality:</b> year-end lead mix differs from the training data; mitigated by drift alerts and the quarterly retrain.</li><li><b>Silent upstream change:</b> a CRM admin edits a field with no notice. Mitigated by the data contract, but needs a change-notice process.</li><li><b>Self-fulfilling scores:</b> Cold leads get less attention, so they convert less, and the model looks right. The A/B holdout is the guard.</li><li><b>Trust erosion:</b> two bad Hot leads in a week can undo the training. Keep reason codes visible and a fast feedback channel open.</li><li><b>Key-person and capacity:</b> DS on-call ends after 4 weeks; sales capacity can limit SLA however good the scores are.</li><li><b>Short pilot:</b> two weeks shows adoption and guardrails, not lift. Lift is proved only by the A/B test.</li></ul>`}]];
// ---------- wiring
function draw(){$('#nv').innerHTML=V.map((v,i)=>`<button class="${i==S.tab?'on':''}" data-t="${i}">${v[0]}</button>`).join('');$('#v').innerHTML=V[S.tab][1]();if(V[S.tab][0]=='A/B test')abCalc();verdict();sv()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){S.tab=+t.dataset.t;draw()}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.c!==undefined)S.chk[d.c]=e.target.checked;else if(d.u!==undefined)S.uat[d.u]=e.target.value;else if(d.p!==undefined)S.p[d.p]=e.target.value;else if(d.g!==undefined){const[a,b]=d.g.split('|');S.g[a+b]=e.target.value}else if(e.target.id!='L')return;draw()});
document.addEventListener('input',e=>{if(e.target.classList.contains('ab'))abCalc();if(e.target.id=='L'&&e.target.value)draw()});
draw();
</script></main></body></html>
